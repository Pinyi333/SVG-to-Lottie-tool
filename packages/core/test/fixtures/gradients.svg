<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 100 50">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.4" />
    </linearGradient>
    <!-- Geometry of its own, stops borrowed from #sky. -->
    <linearGradient id="sky-turned" xlink:href="#sky" gradientTransform="rotate(90 0.5 0.5)" />
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="20" cy="20" r="10" fx="16" fy="18">
      <stop offset="0" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </radialGradient>
    <pattern id="checks" width="4" height="4">
      <rect width="2" height="2" />
    </pattern>
  </defs>

  <rect id="backdrop" x="0" y="0" width="100" height="50" fill="url(#sky)" />
  <circle id="sun-disc" cx="20" cy="20" r="10" fill="url(#sun)" />
  <rect id="banner" x="0" y="40" width="100" height="10" fill="url(#sky-turned)" />
  <rect id="patterned" x="60" y="5" width="20" height="20" fill="url(#checks) #64748b" />
  <rect id="missing" x="60" y="30" width="20" height="10" fill="url(#nope)" />
  <path id="edge" d="M5 45 95 45" fill="none" stroke="url(#sun)" stroke-width="2" />
</svg>
