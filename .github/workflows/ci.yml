name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint and formatting need nothing built, so they run first for fast
      # feedback on trivial problems.
      - run: pnpm lint

      - run: pnpm format:check

      # The app imports svgmotion from its built output rather than its source,
      # so the package has to exist before anything typechecks against it.
      # This step also proves the published entry points actually resolve.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web exec playwright install --with-deps chromium

      # Building here rather than inside Playwright's webServer: a cold build
      # of both packages does not reliably finish inside the server's start
      # timeout, and the failure surfaces as an unhelpful timeout message.
      - run: pnpm build

      - run: pnpm --filter web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
